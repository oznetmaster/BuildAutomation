name: Shared Cake build
description: Run a repository build recipe through the pinned Cake component; does not publish or select runners.
inputs:
  task:
    description: Task name in the repository recipe
    required: true
  root:
    description: Repository directory, relative to github.workspace
    default: '.'
  recipe:
    description: Recipe path relative to the repository
    default: build/recipe.json
runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Run pinned Cake component
      shell: pwsh
      env:
        BUILD_COMPONENT: ${{ github.action_path }}
        BUILD_REPOSITORY: ${{ github.workspace }}/${{ inputs.root }}
        BUILD_RECIPE: ${{ inputs.recipe }}
        BUILD_TASK: ${{ inputs.task }}
      run: |
        & "$env:BUILD_COMPONENT/Invoke-Build.ps1" -Root $env:BUILD_REPOSITORY -Recipe $env:BUILD_RECIPE -Task $env:BUILD_TASK
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
