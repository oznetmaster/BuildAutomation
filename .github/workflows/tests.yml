name: Build component tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Test public driver packaging policy
        shell: pwsh
        run: ./PublicDriverPackaging/Test-PublicDriverArtifacts.ps1
      - name: Test shared driver versioning policy
        shell: pwsh
        run: ./DriverVersioning/Test-SharedDriverVersioning.ps1
      - name: Test post-release validation dispatch
        shell: pwsh
        run: ./.github/actions/post-release-validation/Test-PostReleaseValidation.ps1
      - name: Test shared coverage evidence primitives
        shell: pwsh
        run: ./TestCoverage/Test-Coverage.ps1
      - name: Test shared NuGet artifact preservation
        shell: pwsh
        run: ./NuGetArtifacts/Test-NuGetArtifacts.ps1
      - name: Test shared native driver packaging
        shell: pwsh
        run: |
          dotnet tool install dotnet-ilrepack --version 2.0.45 --tool-path artifacts/packaging-tools
          if ($LASTEXITCODE -ne 0) { throw 'Pinned ILRepack fixture dependency installation failed.' }
          $tool = @(Get-ChildItem artifacts/packaging-tools -Recurse -Force -Filter ILRepackTool.dll)
          if ($tool.Count -ne 1) { throw 'Expected one pinned ILRepack fixture tool.' }
          ./DriverPackaging/Test-DriverPackaging.ps1 -ToolDirectory $tool[0].Directory.FullName
          if ($IsWindows) {
            ./DriverPackaging/Test-MergeAssemblyResolver.ps1 -ToolDirectory $tool[0].Directory.FullName -ResultsDirectory artifacts/merge-resolver
          }
      - run: dotnet restore Tests/BuildAutomation.Tests.csproj --locked-mode
      - run: dotnet test Tests/BuildAutomation.Tests.csproj -c Release --no-restore --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: component-tests-${{ matrix.os }}
          path: TestResults/*.trx
          if-no-files-found: error
