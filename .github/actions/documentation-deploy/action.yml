name: Deploy standard documentation
description: Deploy the existing Pages artifact with the caller's existing retry policy.
inputs:
  attempts:
    description: Preserve a single deployment or the existing three-attempt retry policy
    default: '1'
outputs:
  page_url:
    description: URL returned by the successful Pages deployment
    value: ${{ steps.deploy_1.outputs.page_url || steps.deploy_2.outputs.page_url || steps.deploy_3.outputs.page_url }}
runs:
  using: composite
  steps:
    - name: Validate deployment policy
      shell: pwsh
      env:
        DEPLOY_ATTEMPTS: ${{ inputs.attempts }}
      run: |
        if ($env:DEPLOY_ATTEMPTS -notin @('1','3')) { throw 'Pages attempts must be 1 or 3.' }
    - uses: actions/deploy-pages@v4
      id: deploy_1
      continue-on-error: ${{ inputs.attempts == '3' }}
    - name: Wait before retry 1
      if: inputs.attempts == '3' && steps.deploy_1.outcome == 'failure'
      shell: pwsh
      run: Start-Sleep -Seconds 20
    - uses: actions/deploy-pages@v4
      id: deploy_2
      if: inputs.attempts == '3' && steps.deploy_1.outcome == 'failure'
      continue-on-error: true
    - name: Wait before retry 2
      if: inputs.attempts == '3' && steps.deploy_1.outcome == 'failure' && steps.deploy_2.outcome == 'failure'
      shell: pwsh
      run: Start-Sleep -Seconds 20
    - uses: actions/deploy-pages@v4
      id: deploy_3
      if: inputs.attempts == '3' && steps.deploy_1.outcome == 'failure' && steps.deploy_2.outcome == 'failure'
